name: Build distributions

# Reusable: builds the sdist and the wheel (the version is derived from the git tag), checks that the built version is the tag,
# checks their metadata and uploads them as the artifact "dist". pypi.yml publishes it and release.yml attaches the sdist;
# each of the two builds its own copy from the same tag. The build tooling is installed from .github/requirements-build.txt,
# which pins every package to exact versions and file hashes.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the version is derived from the git tags
          persist-credentials: false
      - name: Build the sdist and the wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/pip" install --quiet --require-hashes --only-binary=:all: -r .github/requirements-build.txt
          "$RUNNER_TEMP/build/bin/python" -m build --no-isolation --outdir dist
          "$RUNNER_TEMP/build/bin/twine" check --strict dist/*
      - name: The built version must be the tag
        run: |
          test -f "dist/appjail-${GITHUB_REF_NAME#v}.tar.gz" || { echo "tag $GITHUB_REF_NAME does not match the built version:" >&2; ls dist >&2; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
