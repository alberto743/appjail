name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Ubuntu 24.04 blocks unprivileged user namespaces with AppArmor; bubblewrap needs them
      # (the test guest does not have this restriction).
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Same package list as the test guest, minus the kernel the guest swaps in for DRM drivers.
      - name: Install the guest packages
        run: |
          sudo apt-get update
          sed 's/#.*//' tests/vm/packages.txt | grep -v '^ *linux-image' | xargs sudo apt-get install -y --no-install-recommends

      - name: Run the tests
        env:
          BJAIL_INTEGRATION: "1"
        run: python3 -m pytest -q
