name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/guest-setup

      - name: Install ruff (no distribution package)
        run: tests/vm/install-ruff.sh

      - name: Show the versions under test
        run: |
          . /etc/os-release && echo "$PRETTY_NAME, kernel $(uname -r)"
          bwrap --version; pasta --version | head -1; Xwayland -version 2>&1 | head -1
          /usr/libexec/xdg-desktop-portal --version; weston --version; reuse --version; ruff --version; python3 --version
          pipewire --version | head -2 | tail -1
          python3 -I -c 'import sys; sys.path.insert(0, "src/appjail"); import landlock; print("Landlock ABI", landlock.abi())'

      - name: Run the tests
        env:
          APPJAIL_INTEGRATION: "1"
        run: python3 -m pytest -q

  # No commit message may carry a session link, a local path or a personal e-mail (.githooks/forbidden-patterns).
  hygiene:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check every commit message
        run: python3 -I .github/scripts/commit_hygiene.py HEAD

  # Installs appjail with pip into a fresh virtual environment and runs the `appjail` command, as a user would.
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pytest and venv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pytest python3-venv

      - name: The pinned release tooling installs (what build-dist.yml uses on a tag)
        run: |
          python3 -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/pip" install --quiet --require-hashes --only-binary=:all: -r .github/requirements-build.txt

      - name: Build, install and run
        env:
          APPJAIL_E2E: "1"
        run: python3 -m pytest -q tests/test_packaging.py
