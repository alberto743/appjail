name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      # Ubuntu blocks unprivileged user namespaces with AppArmor where the key exists; bubblewrap needs them
      # (the test guest does not have this restriction). Fail loudly if they are unusable afterwards.
      - name: Allow unprivileged user namespaces
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user true

      # Same package list as the test guest, minus the kernel the guest swaps in for DRM drivers.
      - name: Install the guest packages
        run: |
          sudo apt-get update
          sed 's/#.*//' tests/vm/packages.txt | grep -Ev '^ *linux-image' | xargs sudo apt-get install -y --no-install-recommends

      - name: Install ruff (no distribution package)
        run: tests/vm/install-ruff.sh

      - name: Show the versions under test
        run: |
          . /etc/os-release && echo "$PRETTY_NAME, kernel $(uname -r)"
          bwrap --version; pasta --version | head -1; Xwayland -version 2>&1 | head -1
          /usr/libexec/xdg-desktop-portal --version; weston --version; reuse --version; ruff --version; python3 --version

      - name: Run the tests
        env:
          APPJAIL_INTEGRATION: "1"
        run: python3 -m pytest -q

  # Installs appjail with pip into a fresh virtual environment and runs the `appjail` command, as a user would.
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install pytest and venv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pytest python3-venv

      - name: Build, install and run
        env:
          APPJAIL_E2E: "1"
        run: python3 -m pytest -q tests/test_packaging.py
