name: Check supported systems

# Once a month (and by hand): compare the systems the project targets (the guests of tests/vm/guest.sh, the runner label)
# with endoflife.date and open an issue for each new Debian stable, Ubuntu LTS or Fedora release. It only reports.
on:
  workflow_dispatch:
  schedule:
    - cron: "21 6 1 * *"

permissions:
  contents: read

concurrency:
  group: check-platforms
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare with endoflife.date
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/check_platforms.py
