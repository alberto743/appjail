name: PyPI

# Publishes to PyPI when a version tag (vX.Y.Z) is pushed. Uses PyPI trusted publishing (OIDC): no API token is
# stored. One-time setup on PyPI: add a trusted publisher for project "appjail" (owner alberto743, repository
# appjail, workflow pypi.yml, environment pypi). The "pypi" environment exists in the repository settings (tags only).
# Nothing is built or published unless CI passed on the tagged commit (ci-gate.yml).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      actions: read
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: The tag must match the package version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml" >&2; exit 1; }
      - name: Build the sdist and the wheel
        run: |
          python3 -m venv "$RUNNER_TEMP/build"
          "$RUNNER_TEMP/build/bin/pip" install --quiet build twine
          "$RUNNER_TEMP/build/bin/python" -m build --outdir dist
          "$RUNNER_TEMP/build/bin/twine" check --strict dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/appjail/
    permissions:
      id-token: write  # trusted publishing; only this job gets it
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
