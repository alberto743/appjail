name: PyPI

# Publishes to PyPI when a version tag (vX.Y.Z) is pushed. Uses PyPI trusted publishing (OIDC): no API token is
# stored. The trusted publisher is registered on PyPI for project "appjail" (owner alberto743, repository appjail,
# workflow pypi.yml, environment pypi); the "pypi" environment exists in the repository settings (tags only).
# Nothing is built or published unless CI passed on the tagged commit (ci-gate.yml); the distributions come from
# build-dist.yml, shared with release.yml.

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      actions: read
      contents: read

  build:
    needs: ci
    uses: ./.github/workflows/build-dist.yml
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/appjail/
    permissions:
      id-token: write  # trusted publishing; only this job gets it
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@v1.14.3
