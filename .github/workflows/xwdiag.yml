name: Xwayland diagnosis
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends weston xwayland x11-utils
      - name: Bare weston + Xwayland + a client that maps a window (no appjail)
        run: |
          export XDG_RUNTIME_DIR=/tmp/xrt; mkdir -m 700 -p $XDG_RUNTIME_DIR
          Xwayland -version 2>&1 | head -1; weston --version
          weston --backend=headless --renderer=pixman --socket=wl-diag >/dev/null 2>&1 &
          sleep 3
          for variant in "" "-shm" "XWAYLAND_NO_GLAMOR=1"; do
            echo "=== variant: '$variant'"
            rm -f /tmp/dpy
            if [ "${variant#XWAYLAND}" != "$variant" ]; then export $variant; fi
            WAYLAND_DISPLAY=wl-diag Xwayland -rootless -nolisten tcp ${variant#XWAYLAND*} -displayfd 3 3>/tmp/dpy >/tmp/xw.log 2>&1 &
            XP=$!
            for i in $(seq 40); do [ -s /tmp/dpy ] && break; sleep 0.1; done
            D=:$(cat /tmp/dpy)
            DISPLAY=$D timeout 4 xev -geometry 200x100 >/dev/null 2>&1 &
            sleep 2
            if kill -0 $XP 2>/dev/null; then echo "Xwayland alive after window map"; else echo "Xwayland DIED"; grep -E "Caught|Segmentation|glamor|Fatal" /tmp/xw.log; fi
            kill $XP 2>/dev/null; wait $XP 2>/dev/null || true
            unset XWAYLAND_NO_GLAMOR
          done
      - name: Same Xwayland with ImageMagick display (no appjail, no jail)
        run: |
          export XDG_RUNTIME_DIR=/tmp/xrt2; mkdir -m 700 -p $XDG_RUNTIME_DIR
          mkdir /tmp/im && cd /tmp/im
          curl -sSL -o im.AppImage https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-34/ImageMagick-7.1.2-34-gcc-x86_64.AppImage
          echo "6e9edfd35d5f30b57c27533afe003d6085faaf8607b207426f398d11751acf93  im.AppImage" | sha256sum -c -
          chmod +x im.AppImage; ./im.AppImage --appimage-extract >/dev/null
          weston --backend=headless --renderer=pixman --socket=wl-diag2 >/dev/null 2>&1 &
          sleep 3
          for variant in "" "-shm"; do
            echo "=== variant: '$variant'"
            rm -f /tmp/dpy
            WAYLAND_DISPLAY=wl-diag2 Xwayland -rootless -nolisten tcp $variant -displayfd 3 3>/tmp/dpy >/tmp/xw.log 2>&1 &
            XP=$!
            for i in $(seq 40); do [ -s /tmp/dpy ] && break; sleep 0.1; done
            D=:$(cat /tmp/dpy)
            DISPLAY=$D timeout 6 squashfs-root/AppRun display logo: >/tmp/im.log 2>&1 &
            sleep 4
            if kill -0 $XP 2>/dev/null; then echo "Xwayland alive after window map"; else echo "Xwayland DIED"; grep -E "Caught|Segmentation|glamor|Fatal" /tmp/xw.log; fi
            cat /tmp/im.log | head -3
            kill $XP 2>/dev/null; wait $XP 2>/dev/null || true
          done
