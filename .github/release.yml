#
# Categories of GitHub's generated notes (pull requests only; direct commits are grouped by
# .github/scripts/release_notes.py, which appends these notes).
changelog:
  categories:
    - title: Security
      labels: [security]
    - title: Pinned tools
      labels: [tools]
    - title: Dependencies
      labels: [dependencies]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
