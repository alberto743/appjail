version: 2
updates:
  # The workflow actions are pinned to a full commit SHA with a trailing "# vX.Y.Z" comment; Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
  # The release tooling (.github/requirements-build.txt) and the documentation tooling (.github/requirements-docs.txt) are
  # pinned by version and hash; Dependabot proposes new versions with their hashes, to be reviewed like any dependency.
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
