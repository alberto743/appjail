name: Documentation
description: A page is wrong, unclear, out of date, or something is missing.
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: Its address on https://alberto743.github.io/appjail/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: What it should say, if you know
