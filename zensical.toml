#
# The documentation site (https://alberto743.github.io/appjail/). Built by tests/vm/docs.sh in the guest and by
# .github/workflows/docs.yml, always with `zensical build --strict` (a missing page or anchor fails the build).
# The site loads nothing from other servers: no web fonts, no CDN scripts, no emoji images, no math renderer.

[project]
site_name = "appjail"
site_description = "AppImages from sources you name, pinned by hash, each in its own bubblewrap jail."
site_url = "https://alberto743.github.io/appjail/"
repo_url = "https://github.com/alberto743/appjail"
repo_name = "alberto743/appjail"
copyright = "appjail is free software under the MPL-2.0"
extra_css = ["stylesheets/appjail.css"]

