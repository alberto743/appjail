[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "appjail"
dynamic = ["version"]  # from the git tag, see [tool.hatch.version]
description = "Sandboxed AppImage manager built on bubblewrap"
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSES/MPL-2.0.txt"]
dependencies = []  # standard library only, by design
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
appjail = "appjail.cli:main"

# The version is the last vX.Y.Z tag, plus the commits since it and the short hash (PEP 440, like `git describe`). An sdist has
# no git history: it carries the version in its PKG-INFO.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/appjail"]

# The sdist carries what is needed to build, install and license the package; the tests, the design
# document and the guest scripts live in the repository only.
[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSES", "/README.md", "/REUSE.toml"]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
# These files deal with bidirectional overrides and control characters on purpose.
"src/appjail/textsafe.py" = ["PLE2502"]
"tests/test_textsafe.py" = ["PLE2502"]
# Headless compositors and sway keep their log file open for the life of the test.
"tests/test_runner.py" = ["SIM115"]
"tests/test_wayland.py" = ["SIM115"]

[tool.ruff.lint]
# Return codes are always inspected by hand; check=True would raise instead of the project's own errors.
extend-ignore = ["PLW1510"]
