[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "appjail"
version = "0.1.0"
description = "Sandboxed AppImage manager built on bubblewrap"
readme = "README.md"
requires-python = ">=3.12"
license = "MPL-2.0"
license-files = ["LICENSES/MPL-2.0.txt"]
dependencies = []  # standard library only, by design
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: System :: Software Distribution",
]

[project.scripts]
appjail = "appjail.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/appjail"]

# The sdist carries what is needed to build, install and license the package; the tests, the design
# document and the guest scripts live in the repository only.
[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSES", "/README.md", "/REUSE.toml"]
exclude = ["__pycache__", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra"
